<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oh My Clipboard</title>
    <link rel="stylesheet" href="./renderer/styles/app.css" />
  </head>
  <body data-theme="system">
    <div class="app-shell">
      <section id="history-view" class="screen screen--overlay-header">
        <header class="screen-header">
          <div class="screen-header__leading">
            <button id="open-settings" class="icon-button" type="button" aria-label="Open settings">
              <span>⚙</span>
            </button>
            <div id="history-header-copy" class="screen-header__copy">
              <p id="history-kicker" class="eyebrow">Clipboard</p>
              <h1 id="history-title" class="screen-title">Oh My Clipboard</h1>
            </div>
          </div>

          <button id="clear" class="action-button action-button--secondary" type="button">
            Clear
          </button>
        </header>

        <div class="settings-groups screen-body history-groups">
          <section class="settings-group panel history-group">
            <div id="history-panel-header" class="panel__header">
              <div>
                <p id="history-panel-kicker" class="panel__kicker">Recent items</p>
                <h2 id="history-panel-title" class="panel__title">Clipboard History</h2>
              </div>
            </div>

            <div class="history-toolbar">
              <label class="search-field" for="history-search">
                <span class="search-field__icon" aria-hidden="true">⌕</span>
                <input id="history-search" type="search" autocomplete="off" spellcheck="false" />
              </label>
              <button id="history-search-clear" class="icon-button history-search-clear" type="button" aria-label="Clear search">
                <span>×</span>
              </button>
            </div>

            <div id="list" class="history-list"></div>
          </section>
        </div>
      </section>

      <section id="settings-view" class="screen screen--overlay-header hidden">
        <header class="screen-header">
          <div class="screen-header__leading">
            <button id="back" class="icon-button" type="button" aria-label="Go back">
              <span>←</span>
            </button>
            <div id="settings-header-copy" class="screen-header__copy">
              <p id="settings-kicker" class="eyebrow">Preferences</p>
              <h1 id="settings-title" class="screen-title">Settings</h1>
            </div>
          </div>
        </header>

        <div id="settings-groups" class="settings-groups screen-body"></div>

        <footer class="settings-footer">
          <button id="open-login-settings" class="action-button action-button--secondary action-button--full" type="button">
            Open macOS Login Items Settings
          </button>
        </footer>
      </section>
    </div>

    <script src="./renderer/scripts/translations.js"></script>
    <script src="./renderer/scripts/settings-config.js"></script>
    <script src="./renderer/scripts/app.js"></script>
  </body>
</html>
